name: hermes-shunt
version: "0.1.1"
description: >-
  Shunts I/O-heavy work (large file reads, boilerplate generation) to one-shot
  worker LLM calls via ctx.llm, so file corpora never enter the orchestrator's
  context. Hermes port of Spotify's shunt Claude Code plugin.
author:
  name: Trinaldi Rizki Permana
license: Apache-2.0
homepage: https://github.com/trinaldirizki/hermes-shunt
keywords: [token-optimization, delegation, bulk-read, context-window]
provides_tools: [bulk_read, code_write]
provides_hooks: [pre_tool_call, pre_llm_call]
